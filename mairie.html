<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mairie - Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&family=Cinzel&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100dvh; width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        /* ARRIÈRE-PLAN : Image dézoomée */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('page.jpeg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
        }

        /* LE VOILE BLANC TRANSLUCIDE (Inspiré de ta maquette) */
        .overlay-card {
            background: rgba(255, 255, 255, 0.45); /* Voile blanc translucide */
            backdrop-filter: blur(10px); /* Effet flouté derrière la carte */
            -webkit-backdrop-filter: blur(10px);
            width: 90%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            color: #1a1a1a;
        }

        /* STYLE DU TITRE SCRIPT */
        .script-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: #c39d7b; /* Couleur sable dorée */
            margin-bottom: 20px;
            font-weight: 400;
        }

        .intro {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #333;
        }

        .event-info {
            margin-bottom: 25px;
        }

        .date-time {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 5px;
        }

        .location {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
        }

        .address {
            font-size: 0.85rem;
            opacity: 0.8;
            line-height: 1.4;
        }

        .divider {
            width: 50px;
            height: 1px;
            background: #c39d7b;
            margin: 20px auto;
            opacity: 0.5;
        }

        /* BOUTON RETOUR STYLE SABLE */
        .back-btn {
            margin-top: 30px;
            display: inline-block;
            background: #c39d7b;
            color: #fff;
            text-decoration: none;
            padding: 12px 35px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #b08968;
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="main-ui">
        <div class="overlay-card">
            
            <h1 class="script-title">Mairie</h1>

            <p class="intro">
                Lara et Gabriel se diront<br>
                « Oui »
            </p>

            <div class="event-info">
                <span class="date-time">Le 16 Juin 2026 à 15h00</span>
                <span class="location">Mairie de Levallois</span>
                <p class="address">1 place de la République, 92300 Levallois</p>
            </div>

            <div class="divider"></div>

            <div class="event-info">
                <span class="date-time">After Mairie</span>
                <span class="location">Salon Hoche</span>
                <p class="address">9 avenue Hoche, 75008 Paris</p>
            </div>

            <a href="premiere-page.html" class="back-btn">Retour</a>
        </div>
    </div>

</body>
</html>
