<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mairie - Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100dvh; width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        /* IMAGE PLEIN ÉCRAN */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('page.png') no-repeat center center;
            background-size: 100% 100%; 
            z-index: 1;
        }

        /* EFFET FONDU UNIFICATEUR - LÉGÈREMENT PLUS SOMBRE POUR LE CONTRASTE */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2); 
            z-index: 2;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* TITRE SECTION - COULEUR PLUS FONCÉE */
        .script-title {
            font-family: 'Great Vibes', cursive;
            font-size: 4.8rem;
            color: #2a1a0f; 
            margin-bottom: 10px;
            text-shadow: 0px 0px 15px rgba(255, 255, 255, 1);
        }

        /* BELLE ÉCRITURE POUR LARA ET GABRIEL - PLUS FONCÉE */
        .names-intro {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #2a1a0f;
            margin-bottom: 30px;
            line-height: 1.2;
            text-shadow: 0px 0px 15px rgba(255, 255, 255, 1);
        }

        .event-group {
            margin-bottom: 25px;
        }

        .date-time {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.85rem;
            color: #000; /* Passage au noir pour une lisibilité maximale */
            margin-bottom: 6px;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 1);
        }

        .location-name {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: #2a1a0f;
            margin-bottom: 4px;
            text-shadow: 0px 0px 15px rgba(255, 255, 255, 1);
        }

        .address-detail {
            font-size: 0.85rem;
            color: #000;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 1);
        }

        .divider {
            width: 40px;
            height: 1.5px;
            background: #8b6b4d;
            margin: 20px auto;
        }

        /* BOUTON RETOUR */
        .back-btn {
            margin-top: 25px;
            display: inline-block;
            background: #8b6b4d; 
            color: #fff;
            text-decoration: none;
            padding: 14px 50px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <div class="main-ui">
        <h1 class="script-title">Mairie</h1>

        <div class="names-intro">
            Lara et Gabriel se diront<br>« Oui »
        </div>

        <div class="event-group">
            <p class="date-time">Le 16 Juin 2026 à 15h00</p>
            <h2 class="location-name">À la Mairie de Levallois</h2>
            <p class="address-detail">1 place de la République, 92300 Levallois-Perret</p>
        </div>

        <div class="divider"></div>

        <div class="event-group">
            <p class="date-time">En After Mairie</p>
            <h2 class="location-name">Au Salon Hoche</h2>
            <p class="address-detail">9 avenue Hoche, 75008 Paris</p>
        </div>

        <a href="premiere-page.html" class="back-btn">Retour</a>
    </div>

</body>
</html>
