<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mairie - Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@800;900&family=Cinzel:wght@900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100dvh; width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        /* IMAGE PLEIN ÉCRAN */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('page.png') no-repeat center center;
            background-size: 100% 100%; 
            z-index: 1;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* TEXTE XXL ET CONTOUR ÉPAIS */
        .heavy-glow {
            /* Triple ombre pour un effet de contour blanc "néon" très marqué */
            text-shadow: 
                0px 0px 20px rgba(255, 255, 255, 1),
                0px 0px 10px rgba(255, 255, 255, 1),
                0px 0px 5px rgba(255, 255, 255, 1);
        }

        .script-title {
            font-family: 'Great Vibes', cursive;
            font-size: 5.5rem; /* Taille augmentée */
            color: #3d2b1f; /* Marron de l'index */
            margin-bottom: 10px;
            text-shadow: 0px 0px 25px rgba(255, 255, 255, 1), 0px 0px 10px rgba(255, 255, 255, 1);
        }

        .intro {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #3d2b1f;
            font-weight: 900; /* Épaisseur maximale */
            text-shadow: 0px 0px 15px rgba(255, 255, 255, 1);
        }

        .event-info {
            margin-bottom: 35px;
        }

        .date-time {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 1.1rem;
            color: #000;
            margin-bottom: 10px;
            text-shadow: 0px 0px 12px rgba(255, 255, 255, 1);
        }

        .location {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem; /* Plus gros */
            letter-spacing: 3px;
            font-weight: 900;
            color: #3d2b1f;
            text-shadow: 0px 0px 15px rgba(255, 255, 255, 1);
        }

        .address {
            font-size: 1rem;
            color: #000;
            font-weight: 800;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 1);
        }

        .divider {
            width: 80px;
            height: 3px;
            background: #3d2b1f; 
            margin: 30px auto;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 1);
        }

        .back-btn {
            margin-top: 20px;
            display: inline-block;
            background: #c39d7b; /* Couleur sable */
            color: #fff;
            text-decoration: none;
            padding: 18px 60px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 900;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="main-ui">
        <h1 class="script-title">Mairie</h1>

        <p class="intro">Lara & Gabriel</p>

        <div class="event-info">
            <span class="date-time">Mardi 16 Juin — 15H00</span>
            <span class="location">Mairie de Levallois</span>
            <p class="address">1 Place de la République</p>
        </div>

        <div class="divider"></div>

        <div class="event-info">
            <span class="date-time">L'After Mairie</span>
            <span class="location">Salon Hoche</span>
            <p class="address">9 Avenue Hoche, Paris</p>
        </div>

        <a href="premiere-page.html" class="back-btn">Retour</a>
    </div>

</body>
</html>
