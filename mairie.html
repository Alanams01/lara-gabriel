<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mairie - Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100dvh; width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        /* PLEIN ÉCRAN TOTAL */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('page.png') no-repeat center center;
            background-size: 100% 100%; 
            z-index: 1;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
        }

        /* VOILE ULTRA-TRANSPARENT (0.03) AVEC FLOU */
        .overlay-card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            width: 90%;
            max-width: 400px;
            padding: 55px 25px;
            text-align: center;
            border-radius: 2px;
            color: #1a1a1a;
        }

        /* TITRE MARRON COMME SUR L'INDEX */
        .script-title {
            font-family: 'Great Vibes', cursive;
            font-size: 4.2rem;
            color: #3d2b1f; 
            margin-bottom: 30px;
            font-weight: 400;
        }

        .intro {
            font-size: 1.2rem;
            font-style: italic;
            margin-bottom: 40px;
            line-height: 1.6;
            color: #3d2b1f; /* Rappel marron index */
            font-weight: 700;
        }

        .event-info {
            margin-bottom: 35px;
        }

        .date-time {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.95rem;
            display: block;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        .location {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: #3d2b1f; /* Rappel marron index */
        }

        .address {
            font-size: 0.9rem;
            color: #1a1a1a;
            font-weight: 600;
            line-height: 1.6;
        }

        .divider {
            width: 45px;
            height: 1px;
            background: #c39d7b; /* Couleur sable bouton index */
            margin: 30px auto;
            opacity: 0.5;
        }

        /* BOUTON SABLE */
        .back-btn {
            margin-top: 10px;
            display: inline-block;
            background: #c39d7b; 
            color: #fff;
            text-decoration: none;
            padding: 16px 55px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            transition: 0.3s;
            font-weight: 700;
        }

        .back-btn:hover {
            background: #b08968;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="main-ui">
        <div class="overlay-card">
            <h1 class="script-title">Mairie</h1>

            <p class="intro">
                Lara et Gabriel se diront<br>
                « Oui »
            </p>

            <div class="event-info">
                <span class="date-time">Mardi 16 Juin 2026 à 15h00</span>
                <span class="location">Mairie de Levallois</span>
                <p class="address">1 place de la République, 92300 Levallois</p>
            </div>

            <div class="divider"></div>

            <div class="event-info">
                <span class="date-time">After Mairie</span>
                <span class="location">Salon Hoche</span>
                <p class="address">9 avenue Hoche, 75008 Paris</p>
            </div>

            <a href="premiere-page.html" class="back-btn">Retour</a>
        </div>
    </div>

</body>
</html>
