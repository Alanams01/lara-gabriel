<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mairie - Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100dvh; width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        /* IMAGE PLEIN ÉCRAN */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('page.png') no-repeat center center;
            background-size: 100% 100%; 
            z-index: 1;
        }

        /* EFFET FONDU : LÉGER VOILE SUR TOUTE L'IMAGE POUR UNIFIER */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.1); 
            z-index: 2;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* TITRE SCRIPT MARRON */
        .script-title {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #3d2b1f; 
            margin-bottom: 15px;
            /* Halo blanc diffus pour le fondu et la lisibilité */
            text-shadow: 0px 0px 20px rgba(255, 255, 255, 0.8);
        }

        .intro {
            font-size: 1.2rem;
            font-style: italic;
            margin-bottom: 35px;
            color: #3d2b1f;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0px 0px 15px rgba(255, 255, 255, 0.9);
        }

        .event-info {
            margin-bottom: 30px;
        }

        .date-time {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
            color: #1a1a1a;
            margin-bottom: 8px;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.8);
        }

        .location {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: #3d2b1f;
            margin-bottom: 5px;
            text-shadow: 0px 0px 15px rgba(255, 255, 255, 0.9);
        }

        .address {
            font-size: 0.85rem;
            color: #1a1a1a;
            font-weight: 700;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.8);
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #c39d7b;
            margin: 25px auto;
            opacity: 0.6;
        }

        /* BOUTON SABLE FONDU */
        .back-btn {
            margin-top: 20px;
            display: inline-block;
            background: #c39d7b; 
            color: #fff;
            text-decoration: none;
            padding: 14px 50px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <div class="main-ui">
        <h1 class="script-title">Mairie</h1>

        <p class="intro">Lara et Gabriel se diront<br>« Oui »</p>

        <div class="event-info">
            <span class="date-time">Mardi 16 Juin 2026 à 15h00</span>
            <span class="location">Mairie de Levallois</span>
            <p class="address">1 place de la République, Levallois</p>
        </div>

        <div class="divider"></div>

        <div class="event-info">
            <span class="date-time">After Mairie</span>
            <span class="location">Salon Hoche</span>
            <p class="address">9 avenue Hoche, Paris</p>
        </div>

        <a href="premiere-page.html" class="back-btn">Retour</a>
    </div>

</body>
</html>
