<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Houppa & Soirée - Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Assistant:wght@200;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            background-color: #000;
            font-family: 'Cormorant Garamond', serif; 
            color: #1a1a1a;
            overflow: hidden; 
        }

        /* ARRIÈRE-PLAN : Plus de visibilité pour kotel.png */
        .bg-kotel {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Voile blanc réduit de 0.65/0.8 à 0.4/0.55 pour voir l'image derrière */
            background: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.55)), 
                        url('kotel.png') no-repeat center center;
            background-size: cover; /* "Dezoom" visuel par rapport à un zoom forcé */
            z-index: 1;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
        }

        /* CARTE STYLE ÉCRIN SACRÉ */
        .info-card {
            background: rgba(255, 255, 255, 0.94); /* Un peu plus opaque pour compenser le fond plus sombre */
            backdrop-filter: blur(10px);
            padding: 50px 30px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            position: relative;
            border: 1.5px solid #d4af37; /* Bordure un peu plus épaisse */
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .bsd {
            position: absolute;
            top: 15px;
            right: 20px;
            font-family: 'Assistant', sans-serif;
            font-size: 13px; /* Agrandi */
            color: #d4af37;
            font-weight: 400;
        }

        .decorative-icon {
            color: #d4af37;
            font-size: 2rem; /* Agrandi */
            margin-bottom: 20px;
            display: block;
        }

        .main-title {
            font-family: 'Cinzel Decorative', cursive;
            color: #d4af37;
            font-size: 2.2rem; /* Agrandi significativement */
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* Noms en Hébreu plus gros */
        .hebrew-names {
            font-family: 'Assistant', sans-serif;
            font-size: 2.2rem; /* Agrandi */
            color: #1a1a1a;
            margin-bottom: 35px;
            direction: rtl;
            font-weight: 300;
            letter-spacing: 5px;
        }

        .event-details {
            border-top: 1px solid rgba(212, 175, 55, 0.5);
            padding-top: 35px;
        }

        .date-text {
            font-size: 1.8rem; /* Agrandi */
            font-style: italic;
            margin-bottom: 12px;
            display: block;
            color: #2c2c2c;
        }

        .time {
            font-size: 1.4rem; /* Agrandi */
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 35px;
            display: block;
            font-weight: 500;
            color: #d4af37;
        }

        .location-name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.4rem; /* Agrandi */
            color: #1a1a1a;
            margin-bottom: 10px;
            display: block;
        }

        .address {
            font-size: 1.25rem; /* Agrandi */
            color: #555;
            font-style: italic;
            line-height: 1.6;
        }

        .back-btn {
            margin-top: 45px;
            display: inline-block;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 12px; /* Agrandi */
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.8;
            border-bottom: 1px solid #d4af37;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="bg-kotel"></div>

    <div class="main-ui">
        <div class="info-card">
            <span class="bsd">בס"ד</span>
            
            <span class="decorative-icon">❦</span>
            
            <h1 class="main-title">Houppa & Soirée</h1>

            <div class="hebrew-names">
                לרה & גבריאל
            </div>

            <div class="event-details">
                <span class="date-text">Dimanche 21 Juin 2026</span>
                <span class="time">À 17h00 précises</span>
                
                <span class="location-name">Pavillon Dauphine</span>
                <p class="address">
                    Place du Maréchal de Lattre de Tassigny<br>
                    75116 Paris
                </p>
            </div>

            <a href="premiere-page.html" class="back-btn">Retour au programme</a>
        </div>
    </div>

</body>
</html>
