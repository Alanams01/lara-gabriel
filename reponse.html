<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RSVP - Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100%; width: 100%; 
            background: radial-gradient(circle, #ffffff 0%, #fdfbf7 100%);
            font-family: 'Cormorant Garamond', serif; 
            color: #1a1a1a;
        }

        .main-ui {
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 20px;
        }

        .info-card {
            background: #ffffff;
            padding: 50px 35px;
            width: 100%; max-width: 550px;
            text-align: center;
            border: 0.5px solid #d4af37;
            outline: 4px solid #fff;
            outline-offset: -10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            color: #d4af37; font-size: 1.8rem;
            letter-spacing: 6px; text-transform: uppercase;
            margin-bottom: 30px;
        }

        .instruction { font-style: italic; font-size: 1.2rem; margin-bottom: 40px; color: #2c2c2c; }

        .rsvp-form { text-align: left; }

        label { 
            font-family: 'Cinzel Decorative', cursive; 
            font-size: 0.8rem; color: #d4af37; 
            display: block; margin-bottom: 15px;
            letter-spacing: 2px;
        }

        input[type="text"], input[type="number"] {
            width: 100%; padding: 12px;
            border: none; border-bottom: 1px solid #d4af37;
            font-family: 'Cormorant Garamond', serif; font-size: 1.3rem;
            margin-bottom: 35px; outline: none; background: transparent;
        }

        /* --- OPTIONS PRÉSENCE --- */
        .presence-options {
            display: flex; gap: 30px; margin-bottom: 10px;
        }

        .option-item {
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;
        }

        input[type="radio"] { accent-color: #d4af37; transform: scale(1.2); cursor: pointer; }

        /* --- CHAMP NOMBRE MASQUÉ --- */
        .guest-count-box {
            display: none;
            margin-bottom: 35px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-submit {
            width: 100%; margin-top: 20px;
            background: transparent; color: #d4af37;
            border: 1px solid #d4af37; padding: 18px;
            font-family: 'Cinzel Decorative', cursive;
            text-transform: uppercase; letter-spacing: 4px;
            font-size: 0.9rem; cursor: pointer;
            transition: 0.4s;
        }

        .btn-submit:hover { background: #d4af37; color: #fff; }

        .back-btn {
            margin-top: 30px; display: inline-block;
            text-decoration: none; color: #1a1a1a;
            font-size: 0.8rem; text-transform: uppercase;
            letter-spacing: 4px; opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="main-ui">
        <div class="info-card">
            <h1>R.S.V.P.</h1>
            <p class="instruction">Votre réponse est attendue avant le 21 Mai 2026</p>

            <form id="rsvpForm" class="rsvp-form">
                <label>Nom & Prénom</label>
                <input type="text" name="nom" required placeholder="Ex: M. et Mme Cohen">

                <label>Mairie (16 Juin)</label>
                <div class="presence-options">
                    <label class="option-item"><input type="radio" name="mairie_pres" value="Present" onclick="showCount('mairie', true)" required> Présent</label>
                    <label class="option-item"><input type="radio" name="mairie_pres" value="Non" onclick="showCount('mairie', false)"> Non</label>
                </div>
                <div id="count_mairie" class="guest-count-box">
                    <input type="number" name="mairie_nb" placeholder="Nombre de personnes" min="1">
                </div>

                <label>Houppa & Soirée (21 Juin)</label>
                <div class="presence-options">
                    <label class="option-item"><input type="radio" name="houppa_pres" value="Present" onclick="showCount('houppa', true)" required> Présent</label>
                    <label class="option-item"><input type="radio" name="houppa_pres" value="Non" onclick="showCount('houppa', false)"> Non</label>
                </div>
                <div id="count_houppa" class="guest-count-box">
                    <input type="number" name="houppa_nb" placeholder="Nombre de personnes" min="1">
                </div>

                <label>Chabbat (26-27 Juin)</label>
                <div class="presence-options">
                    <label class="option-item"><input type="radio" name="chabbat_pres" value="Present" onclick="showCount('chabbat', true)" required> Présent</label>
                    <label class="option-item"><input type="radio" name="chabbat_pres" value="Non" onclick="showCount('chabbat', false)"> Non</label>
                </div>
                <div id="count_chabbat" class="guest-count-box">
                    <input type="number" name="chabbat_nb" placeholder="Nombre de personnes" min="1">
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Confirmer ma venue</button>
            </form>

            <a href="premiere-page.html" class="back-btn">Retour</a>
        </div>
    </div>

    <script>
        function showCount(event, isPresent) {
            const box = document.getElementById('count_' + event);
            box.style.display = isPresent ? 'block' : 'none';
            if(!isPresent) box.querySelector('input').value = "";
        }

        const scriptURL = 'TON_URL_GOOGLE_APPS_SCRIPT_ICI';
        const form = document.getElementById('rsvpForm');

        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "Envoi en cours...";
            btn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    btn.innerHTML = "Merci pour votre réponse !";
                    form.reset();
                    setTimeout(() => { window.location.href = "premiere-page.html"; }, 2000);
                })
                .catch(error => {
                    alert("Erreur lors de l'envoi");
                    btn.disabled = false;
                    btn.innerHTML = "Confirmer ma venue";
                });
        });
    </script>
</body>
</html>
