<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100dvh; 
            width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        /* EFFET DEZOOM : On ajuste pour voir les lustres et le décor */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.2)), 
                        url('page.jpeg') no-repeat center center;
            background-size: cover; 
            z-index: 1;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            text-align: center;
        }

        /* TYPOGRAPHIE EMPILÉE COMME SUR LA PHOTO */
        .names-container {
            margin-bottom: 50px;
        }

        .names {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 12vw, 4.5rem);
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #3d2b1f; /* Teinte sombre et élégante de la photo */
            font-weight: 400;
            line-height: 1.2;
        }

        .ampersand {
            display: block;
            font-size: 2.2rem;
            margin: 10px 0;
            font-weight: 200;
        }

        /* SOUS-TITRE PRÉCIS */
        .subtitle {
            font-family: 'Montserrat', sans-serif;
            color: #3d2b1f;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-top: 20px;
            font-weight: 400;
        }

        /* BOUTON SABLE "DÉCOUVRIR" */
        .cta-center {
            text-decoration: none; 
            color: #fff; 
            border: none;
            padding: 15px 55px; 
            font-size: 13px; 
            text-transform: uppercase;
            letter-spacing: 5px; 
            background: #c39d7b; /* Couleur beige/sable de la photo */
            transition: 0.4s;
            font-weight: 500;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }

        .cta-center:hover {
            background: #b08968;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="main-ui">
        <div class="names-container">
            <h1 class="names">
                Lara
                <span class="ampersand">&</span>
                Gabriel
            </h1>
            <p class="subtitle">— LA SUITE COMMENCE —</p>
        </div>

        <div class="cta-container">
            <a href="premiere-page.html" class="cta-center">Voir l'invitation</a>
        </div>
    </div>

</body>
</html>
