<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;400&family=Cinzel&display=swap" rel="stylesheet">
    <style>
        /* Reset complet pour mobile */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100dvh; /* Utilise la hauteur dynamique du mobile */
            width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; /* Empêche le rebond du scroll */
        }

        /* Image de fond fixe */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), 
                        url('page.jpeg') no-repeat center center;
            background-size: cover; 
            z-index: 1;
        }

        /* Conteneur principal flexible */
        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            padding: 4dvh 20px; /* Padding proportionnel */
            text-align: center;
        }

        /* Logo adapté au mobile */
        .logo-box {
            width: 100%;
            flex: 0 1 auto;
            display: flex;
            justify-content: center;
        }

        .logo { 
            max-width: 320px; /* Taille optimale mobile */
            width: 85%; 
            height: auto; 
            filter: drop-shadow(0px 5px 20px rgba(0,0,0,0.8)); 
        }

        /* Bouton centré dans l'espace restant */
        .cta-container {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cta-center {
            text-decoration: none; 
            color: #fff; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 18px 45px; 
            font-size: 11px; 
            text-transform: uppercase;
            letter-spacing: 5px; 
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        /* Compteur optimisé pour le bas de l'écran */
        .timer-container {
            width: 100%;
            max-width: 380px;
            flex: 0 0 auto;
            padding-bottom: env(safe-area-inset-bottom); /* Gère l'encoche iPhone */
        }

        .timer-bottom { 
            display: flex; 
            width: 100%; 
            justify-content: space-around;
            background: rgba(0,0,0,0.45);
            padding: 15px 10px;
            border-radius: 4px;
            border: 0.5px solid rgba(255,255,255,0.2);
        }

        .t-item { flex: 1; }

        .t-num { 
            display: block; 
            font-family: 'Cinzel', serif; 
            font-size: 1.6rem; 
            color: #fff; 
            line-height: 1.1; 
        }

        .t-lab { 
            display: block; 
            font-size: 9px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-top: 5px; 
            color: #d4af37;
        }

        /* Media Queries pour écrans très courts */
        @media (max-height: 660px) {
            .logo { max-width: 240px; }
            .t-num { font-size: 1.3rem; }
            .main-ui { padding: 2dvh 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="main-ui">
        <div class="logo-box">
            <img src="logo.png" alt="L&G" class="logo">
        </div>

        <div class="cta-container">
            <a href="premiere-page.html" class="cta-center">Voir l'invitation</a>
        </div>

        <div class="timer-container">
            <div class="timer-bottom">
                <div class="t-item"><span class="t-num" id="d">00</span><span class="t-lab">Jours</span></div>
                <div class="t-item"><span class="t-num" id="h">00</span><span class="t-lab">Hrs</span></div>
                <div class="t-item"><span class="t-num" id="m">00</span><span class="t-lab">Min</span></div>
                <div class="t-item"><span class="t-num" id="s">00</span><span class="t-lab">Sec</span></div>
            </div>
        </div>
    </div>

    <script>
        const end = new Date("June 21, 2026 17:00:00").getTime();
        function update() {
            const now = new Date().getTime();
            const diff = end - now;
            
            if (diff <= 0) {
                document.getElementById("d").innerText = "00";
                return;
            }

            document.getElementById("d").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("h").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("m").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("s").innerText = Math.floor((diff % (1000 * 60)) / 1000);
        }
        setInterval(update, 1000); 
        update();
    </script>
</body>
</html>
