<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100dvh; 
            width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('page.png') no-repeat center center;
            background-size: 100% 100%; 
            z-index: 1;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.15); /* Légèrement plus blanc pour le contraste */
            z-index: 2;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center;
        }

        .names-container {
            margin-top: -12dvh; 
            animation: fadeIn 2.5s ease-in-out;
        }

        /* ÉCRITURE PLUS ACCENTUÉE ET NETTE */
        .names {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(2rem, 11vw, 3.8rem);
            color: #3b1e2f; 
            font-weight: 500; /* Légèrement plus épais pour la visibilité */
            text-transform: uppercase;
            letter-spacing: 14px;
            line-height: 1.4;
            /* Le secret pour voir sans gras : un contour très fin + ombre dense */
            -webkit-text-stroke: 0.5px #3b1e2f; 
            text-shadow: 
                0px 0px 15px rgba(255, 255, 255, 1), 
                0px 0px 25px rgba(255, 255, 255, 0.8),
                2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .ampersand {
            display: block;
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem; /* Plus grand pour l'accentuer */
            color: #3b1e2f;
            text-transform: none;
            letter-spacing: 0;
            margin: -5px 0;
            font-weight: 400;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 1);
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            color: #3b1e2f;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 8px; 
            margin-top: 25px;
            font-weight: 700; /* Sous-titre bien visible */
            text-shadow: 0px 0px 8px rgba(255, 255, 255, 1);
        }

        .cta-container {
            position: absolute;
            bottom: 12dvh;
        }

        .cta-center {
            text-decoration: none; 
            color: #fff; 
            padding: 15px 50px; 
            font-size: 11px; 
            text-transform: uppercase;
            letter-spacing: 5px; 
            background: #3b1e2f; 
            transition: 0.4s;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(59, 30, 47, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <div class="main-ui">
        <div class="names-container">
            <h1 class="names">
                LARA
                <span class="ampersand">&</span>
                GABRIEL
            </h1>
            <p class="subtitle">La suite commence</p>
        </div>

        <div class="cta-container">
            <a href="premiere-page.html" class="cta-center">Découvrir</a>
        </div>
    </div>

</body>
</html>
