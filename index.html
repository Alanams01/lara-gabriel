<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100dvh; 
            width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        /* AJUSTEMENT DU FOND POUR MOBILE */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* On réduit l'assombrissement pour mieux voir les détails */
            background: linear-gradient(rgba(0,0,0,0.05), rgba(0,0,0,0.15)), 
                        url('page.jpeg') no-repeat center center;
            /* background-size: cover combiné à une position haute permet de voir les lustres sur mobile */
            background-size: cover; 
            background-position: center top; 
            z-index: 1;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            text-align: center;
        }

        .names-container {
            margin-bottom: 40px;
            /* On remonte un peu le texte pour ne pas cacher la Tour Eiffel sur certains écrans */
            margin-top: -10dvh; 
        }

        .names {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 11vw, 4rem);
            letter-spacing: 10px;
            text-transform: uppercase;
            color: #3d2b1f; /* Couleur sombre de la photo */
            font-weight: 400;
            line-height: 1.1;
        }

        .ampersand {
            display: block;
            font-size: 1.8rem;
            margin: 8px 0;
            font-weight: 200;
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            color: #3d2b1f;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: 15px;
            font-weight: 400;
        }

        /* BOUTON SABLE REPOSITIONNÉ */
        .cta-container {
            position: absolute;
            bottom: 12dvh;
        }

        .cta-center {
            text-decoration: none; 
            color: #fff; 
            border: none;
            padding: 14px 45px; 
            font-size: 12px; 
            text-transform: uppercase;
            letter-spacing: 4px; 
            background: #c39d7b; /* Couleur sable précise */
            transition: 0.4s;
            font-weight: 500;
        }

        /* Media Query pour les petits écrans pour s'assurer que l'image ne zoome pas trop */
        @media (max-width: 480px) {
            .bg-container {
                background-size: 160% auto; /* Force un dezoom latéral sur mobile portrait */
            }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="main-ui">
        <div class="names-container">
            <h1 class="names">
                Lara
                <span class="ampersand">&</span>
                Gabriel
            </h1>
            <p class="subtitle">— LA SUITE COMMENCE —</p>
        </div>

        <div class="cta-container">
            <a href="premiere-page.html" class="cta-center">DÉCOUVRIR</a>
        </div>
    </div>

</body>
</html>
