<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chabbat - Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&family=Cinzel:wght@700&family=Assistant:wght@200;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100dvh; width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        /* PLEIN ÉCRAN TOTAL */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('page.png') no-repeat center center;
            background-size: 100% 100%; 
            z-index: 1;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
        }

        /* VOILE ULTRA-TRANSPARENT (0.03) AVEC FLOU */
        .overlay-card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 92%;
            max-width: 450px;
            padding: 50px 25px; 
            text-align: center;
            border-radius: 2px;
            color: #1a1a1a;
            position: relative;
        }

        .bsd {
            position: absolute;
            top: 20px;
            right: 25px;
            font-family: 'Assistant', sans-serif;
            font-size: 11px;
            color: #c39d7b; /* Couleur sable bouton index */
        }

        /* TITRE MARRON COMME SUR L'INDEX */
        .script-title {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem; 
            color: #3d2b1f; 
            margin-bottom: 25px;
            font-weight: 400;
        }

        .hebrew-names {
            font-family: 'Assistant', sans-serif;
            font-size: 2rem;
            color: #3d2b1f; /* Rappel marron index */
            margin-bottom: 40px; 
            direction: rtl;
            font-weight: 300;
            letter-spacing: 4px;
        }

        .event-info {
            margin-bottom: 30px;
        }

        .date-time {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.95rem;
            display: block;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        .location {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #3d2b1f; /* Rappel marron index */
        }

        .address {
            font-size: 0.9rem;
            color: #1a1a1a;
            font-weight: 600;
            line-height: 1.6;
            font-style: italic;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: #c39d7b; /* Couleur sable bouton index */
            margin: 30px auto;
            opacity: 0.4;
        }

        /* BOUTON SABLE INDEX */
        .back-btn {
            margin-top: 20px;
            display: inline-block;
            background: #c39d7b; 
            color: #fff;
            text-decoration: none;
            padding: 14px 45px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: 0.3s;
            font-weight: 700;
        }

        .back-btn:hover {
            background: #b08968;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="main-ui">
        <div class="overlay-card">
            <span class="bsd">בס"ד</span>
            
            <h1 class="script-title">Chabbat Hatan</h1>

            <div class="hebrew-names">
                לרה & גבריאל
            </div>

            <div class="event-info">
                <span class="date-time">26 et 27 Juin 2026</span>
                <span class="location">Centre Européen (CEJ)</span>
                <p class="address">
                    Place de Jérusalem<br>
                    75017 Paris
                </p>
            </div>

            <div class="divider"></div>

            <a href="premiere-page.html" class="back-btn">Retour</a>
        </div>
    </div>

</body>
</html>
