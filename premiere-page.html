<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Programme - Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100dvh; 
            width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        /* FOND PLEIN ÉCRAN TOTAL */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                        url('page.png') no-repeat center center;
            background-size: 100% 100%; 
            z-index: 1;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 60px;
            font-weight: 400;
            color: #ffffff;
            opacity: 0.8;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.8);
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 35px;
            width: 100%;
        }

        .nav-link {
            text-decoration: none;
            display: inline-block;
            transition: 0.4s ease;
        }

        /* COULEUR SABLE DORÉ AVEC GROSSE OMBRE POUR LA LISIBILITÉ */
        .nav-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem; 
            display: block;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #c39d7b; /* Couleur Sable de l'index */
            
            /* L'astuce magique : plusieurs ombres pour créer un contour noir propre */
            text-shadow: 
                0px 2px 4px rgba(0,0,0,1),
                0px 0px 10px rgba(0,0,0,0.8);
            
            transition: 0.3s;
        }

        .nav-link:hover .nav-title {
            transform: scale(1.08);
            color: #ffffff;
            text-shadow: 0px 0px 20px rgba(195, 157, 123, 0.6);
        }

        .divider {
            width: 40px;
            height: 1.5px;
            background: #c39d7b; /* Rappel Sable */
            margin: 0 auto;
            opacity: 0.6;
            box-shadow: 0px 1px 3px rgba(0,0,0,0.5);
        }

        .back-home {
            position: absolute;
            bottom: 40px;
            color: #ffffff;
            text-decoration: none;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            border: 1px solid #c39d7b; /* Contour Sable */
            padding: 12px 30px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            font-weight: 600;
            transition: 0.3s;
        }

        .back-home:hover { 
            background: #c39d7b;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <div class="main-ui">
        <h1>Programme</h1>

        <div class="nav-list">
            <a href="mairie.html" class="nav-link">
                <span class="nav-title">Mairie</span>
            </a>
            <div class="divider"></div>

            <a href="houppa.html" class="nav-link">
                <span class="nav-title">Houppa</span>
            </a>
            <div class="divider"></div>

            <a href="chabbat.html" class="nav-link">
                <span class="nav-title">Chabbat</span>
            </a>
            <div class="divider"></div>

            <a href="reponse.html" class="nav-link">
                <span class="nav-title">Réponse</span>
            </a>
        </div>

        <a href="index.html" class="back-home">Retour</a>
    </div>

</body>
</html>
