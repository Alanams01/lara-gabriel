<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Programme - Lara & Gabriel</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100dvh; width: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
        }

        /* IMAGE PLEIN ÉCRAN */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('page.png') no-repeat center center;
            background-size: 100% 100%; 
            z-index: 1;
        }

        /* EFFET FONDU UNIFICATEUR SUR L'IMAGE */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.15); 
            z-index: 2;
        }

        .main-ui {
            position: relative; 
            z-index: 10; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* TITRE PROGRAMME REHAUSSÉ */
        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            letter-spacing: 8px;
            color: #3d2b1f;
            text-transform: uppercase;
            margin-bottom: 40px; /* Réduit pour laisser de l'air en bas */
            font-weight: 700;
            text-shadow: 0px 0px 15px rgba(255, 255, 255, 0.8);
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Gap légèrement réduit */
            width: 100%;
            margin-bottom: 60px; /* Espace ajouté sous la liste */
        }

        .nav-link {
            text-decoration: none;
            display: block;
            transition: 0.3s ease;
        }

        .nav-item {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: #3d2b1f; 
            font-weight: 400;
            text-shadow: 0px 0px 20px rgba(255, 255, 255, 1);
            transition: 0.3s;
        }

        .nav-link:hover .nav-item {
            transform: scale(1.05);
            opacity: 0.8;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #c39d7b;
            margin: 0 auto;
            opacity: 0.6;
        }

        /* BOUTON RETOUR POSITIONNÉ PLUS BAS */
        .back-home {
            position: absolute;
            bottom: 20px; /* Plus d'espace par rapport au menu */
            color: #ffffff;
            text-decoration: none;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            border: 1px solid #c39d7b;
            padding: 12px 40px; /* Plus large pour l'élégance */
            background: #c39d7b;
            font-weight: 700;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .back-home:hover { 
            background: #b08968;
            border-color: #b08968;
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <div class="main-ui">
        <h1 class="main-title">Programme</h1>

        <div class="nav-list">
            <a href="mairie.html" class="nav-link">
                <span class="nav-item">Mairie</span>
            </a>
            <div class="divider"></div>

            <a href="houppa.html" class="nav-link">
                <span class="nav-item">Houppa & Soirée</span>
            </a>
            <div class="divider"></div>

            <a href="chabbat.html" class="nav-link">
                <span class="nav-item">Chabbat</span>
            </a>
            <div class="divider"></div>

            <a href="reponse.html" class="nav-link">
                <span class="nav-item">Réponse</span>
            </a>
        </div>

        <a href="index.html" class="back-home">Retour</a>
    </div>
</body>
</html>
